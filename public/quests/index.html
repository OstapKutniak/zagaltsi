<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Літопис">
  <meta name="theme-color" content="#14100c">
  <title>Літопис</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="btn-back" class="icon-btn" aria-label="Назад">‹</button>
      <div id="crumbs" class="crumbs"></div>
      <button id="btn-edit" class="icon-btn" aria-label="Редагування">✎</button>
    </header>

    <main id="stage">
      <section id="view" class="view"></section>
    </main>

    <nav id="tabbar">
      <button class="tab on" data-tab="play">Мандрівка</button>
      <button class="tab" data-tab="active">Активні</button>
      <button class="tab" data-tab="quests">Квести</button>
      <button class="tab" data-tab="map">Локації</button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
