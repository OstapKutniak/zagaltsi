name: Deploy to GitHub Pages

# Збирає гру й публікує на GitHub Pages при кожному пуші в main.
# Після одноразового налаштування жодних ручних дій — push і за ~1 хв воно в Telegram.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        # URL воркера-проксі для AI-генерації на живій студії. Це лише АДРЕСА (не ключ) — безпечно
        # в публічному бандлі; ключ Fal тримає сам воркер на сервері. Задається як repo VARIABLE
        # (Settings → Secrets and variables → Actions → Variables), НЕ secret. Не заданий → генерація вимкнена.
        env:
          VITE_FAL_PROXY: ${{ vars.VITE_FAL_PROXY }}
          # URL бот-воркера (horugva-bot) — щоб «Оголосити збір» слав сповіщення в
          # Telegram із кнопкою «Приєднатись». Це лише АДРЕСА (не ключ). Задається як
          # repo VARIABLE VITE_BOT_PROXY = https://horugva-bot.<акаунт>.workers.dev
          VITE_BOT_PROXY: ${{ vars.VITE_BOT_PROXY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
